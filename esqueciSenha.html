<!DOCTYPE html>
<html lang="PT-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar Senha | Acesso+</title>
    <link rel="stylesheet" href="css/loginUser.css">
</head>
<body>
    <section class="containerPai">
        <a href="loginUser.html" class="logo-card"><img src="img/logo.png" alt="Logo Acesso+ e Voltar para login"></a>
        <div class="card loginActive">
            <div class="esquerda">
                <div class="formLogin" style="width: 100%;">
                    <h2>Recuperar Senha</h2>
                    <p style="text-align: center; margin-bottom: 20px; color: #475569;">Digite o e-mail cadastrado na sua conta para receber o link de redefinição.</p>
                    <form action="processa_esqueciSenha.php" method="post">
                        <select name="tipo" id="tipo" aria-label="Tipo de conta" required>
                            <option value="paciente">Sou paciente</option>
                            <option value="profissional">Sou profissional de saúde</option>
                        </select>
                        <input type="email" name="email" placeholder="Digite seu e-mail" aria-label="Digite seu e-mail" required>
                        <button type="submit" name="submit">Enviar E-mail</button>
                    </form>
                    <a href="loginUser.html" class="esqueci-senha" style="display: block; text-align: center; margin-top: 15px;">&larr; Voltar para o Login</a>
                </div>
            </div>
            <div class="direita" style="background: url('img/background2.png') no-repeat center center / cover;">
                <!-- Apenas parte visual direita mantida para coerência do layout -->
            </div>
        </div>
    </section>
    <script>
        // Abre já com o tipo certo quando vem do login do profissional (esqueciSenha.html?tipo=profissional)
        if (new URLSearchParams(location.search).get('tipo') === 'profissional') {
            document.getElementById('tipo').value = 'profissional';
            document.querySelector('.logo-card').href = 'loginProfissional.html';
            document.querySelectorAll('a.esqueci-senha').forEach(a => a.href = 'loginProfissional.html');
        }
    </script>
</body>
</html>
